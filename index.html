<!DOCTYPE html>
<html>
<head>

<title>Smart AI Study Planner+</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

</head>

<body>

<h1>Smart AI Study Planner+</h1>

<button onclick="toggleDark()">Toggle Dark Mode</button>

<div class="container">

<h2>Enter Study Details</h2>

<label>Subjects (comma separated)</label>
<input id="subjects" placeholder="Math, Physics, Programming">

<label>Study Hours Per Day</label>
<input id="hours" type="number">

<button onclick="generatePlan()">Generate Study Plan</button>

<button onclick="generateWeekly()">Generate Weekly Plan</button>

<button onclick="downloadPlan()">Download Study Plan</button>

<h2>Daily Study Plan</h2>
<div id="result"></div>

<h2>Weekly Study Plan</h2>
<div id="weeklyPlan"></div>

<h2>Study Progress</h2>
<ul id="progressList"></ul>

<div id="progressPercent">0% Completed</div>

</div>

<hr>

<h2>Pomodoro Focus Timer</h2>

<div id="timer">25:00</div>

<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>

<script src="script.js"></script>

</body>
</html>
